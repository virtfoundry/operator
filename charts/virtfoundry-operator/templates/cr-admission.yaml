{{- if and .Values.crAdmission.enabled (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- /*
  Cluster-side admission for VirtFoundry CRs (issue #13 + #26 slices).

  - Instance: CREATE/UPDATE only in virtfoundry-tenant-*
  - Offering: CPU/memory bounds (also enforced via CRD OpenAPI)
  - Template: container sourceType images must match the ContainerDisk
    allowlist (same prefixes as imageAllowlist / reconciler #22)
  - dedicatedCPU: denied on Offering/Instance unless
    crAdmission.allowDedicatedCPU=true (KubeVirt DedicatedCPUPlacement gate)

  Tenant slug uniqueness is controller-enforced (#15/#20). Admission-time
  uniqueness still needs validating webhooks (#26 residual): blocked until
  cert-manager is available for Helm Certificate + :9443
  ValidatingWebhookConfiguration (homelab has no cert-manager today).
*/ -}}
{{- $prefixes := .Values.imageAllowlist.prefixes }}
{{- if not $prefixes }}
{{- $prefixes = list "quay.io/containerdisks/" "quay.io/kubevirt/" }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}-cr-admission
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["virtfoundry.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["instances", "offerings", "templates"]
  validations:
    - expression: >-
        !(object.kind == 'Instance') ||
        (has(object.metadata.namespace) &&
         object.metadata.namespace.startsWith('virtfoundry-tenant-') &&
         object.metadata.namespace != 'virtfoundry-tenant-')
      message: Instance must be created in a virtfoundry-tenant-* namespace
      reason: Forbidden
    - expression: >-
        !(object.kind == 'Offering') ||
        (object.spec.cpu >= 1 && object.spec.cpu <= 256 &&
         object.spec.memoryMi >= 64 && object.spec.memoryMi <= 1048576)
      message: Offering cpu must be 1..256 and memoryMi 64..1048576
      reason: Invalid
    - expression: >-
        !(object.kind == 'Template') ||
        object.spec.sourceType.lowerAscii() != 'container' ||
        (size(object.spec.image) > 0 &&
         !object.spec.image.lowerAscii().startsWith('http://') &&
         !object.spec.image.lowerAscii().startsWith('https://') &&
         (
{{- range $i, $p := $prefixes }}
{{- if $i }} ||{{ end }}
           object.spec.image.startsWith({{ $p | quote }})
{{- end }}
         ))
      message: Template container image must match the ContainerDisk allowlist (chart imageAllowlist.prefixes)
      reason: Invalid
{{- if not .Values.crAdmission.allowDedicatedCPU }}
    - expression: >-
        !(object.kind == 'Offering') ||
        !has(object.spec.dedicatedCPU) ||
        object.spec.dedicatedCPU == false
      message: Offering dedicatedCPU is disabled (set chart crAdmission.allowDedicatedCPU=true to enable host CPU pinning)
      reason: Forbidden
    - expression: >-
        !(object.kind == 'Instance') ||
        !has(object.spec.dedicatedCPU) ||
        object.spec.dedicatedCPU == false
      message: Instance dedicatedCPU is disabled (set chart crAdmission.allowDedicatedCPU=true to enable host CPU pinning)
      reason: Forbidden
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "virtfoundry-operator.fullname" . }}-cr-admission
  labels:
    {{- include "virtfoundry-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ include "virtfoundry-operator.fullname" . }}-cr-admission
  validationActions: ["Deny"]
{{- end }}

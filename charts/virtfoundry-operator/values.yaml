nameOverride: ""
fullnamePrefix: virtfoundry-operator

namespace: virtfoundry-system

image:
  repository: ghcr.io/virtfoundry/operator
  tag: "0.7.1"
  digest: ""
  pullPolicy: IfNotPresent

replicas: 1

leaderElection: true

# Cluster-side guard rail: denies the operator ServiceAccount any Namespace
# DELETE outside virtfoundry-tenant-* labelled virtfoundry.io/tenant. Rendered
# only when the cluster serves ValidatingAdmissionPolicy (Kubernetes >= 1.30).
namespaceGuard:
  enabled: true

# Cluster-side CR admission (issue #13): Instance only in virtfoundry-tenant-*,
# Offering CPU/memory bounds. Complements CRD OpenAPI. Tenant slug uniqueness
# is enforced in the controller (#15/#20); admission-time slug checks wait on
# webhooks (#26). Residual: webhook + cert-manager + :9443.
crAdmission:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Homelab sideload: set pullPolicy IfNotPresent after ctr import.

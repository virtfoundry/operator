nameOverride: ""
fullnamePrefix: virtfoundry-operator

namespace: virtfoundry-system

image:
  repository: ghcr.io/virtfoundry/operator
  # Prefer a release tag (semver / git SHA). Do not rely on floating `latest`.
  tag: "0.8.0"
  # Production: set digest (sha256:…) so the chart ignores tag and pins the image.
  # Leave empty only for local/dev when pulling by tag is acceptable.
  digest: ""
  pullPolicy: IfNotPresent
  # When true, helm template/install fails unless image.digest is set (prod gate).
  requireDigest: false

replicas: 1

leaderElection: true

# ContainerDisk image allowlist (issue #22). Empty → built-in
# quay.io/containerdisks/ + quay.io/kubevirt/. Setting prefixes replaces the
# built-in list (private registry mirrors).
imageAllowlist:
  prefixes: []

# Cluster-side guard rail: denies the operator ServiceAccount any Namespace
# DELETE outside virtfoundry-tenant-* labelled virtfoundry.io/tenant. Rendered
# only when the cluster serves ValidatingAdmissionPolicy (Kubernetes >= 1.30).
namespaceGuard:
  enabled: true

# Cluster-side guard rail (issue #28): denies the operator ServiceAccount
# CREATE/UPDATE/DELETE on kubevirt.io VirtualMachines/VMIs outside
# virtfoundry-tenant-*. Complements ClusterRole (still cluster-wide for
# informers); true Role/RoleBinding least privilege is residual on #28.
kubevirtGuard:
  enabled: true

# Cluster-side CR admission (issue #13 + #26): Instance only in
# virtfoundry-tenant-*, Offering CPU/memory bounds, Template container images
# on the ContainerDisk allowlist (imageAllowlist.prefixes), and dedicatedCPU
# denied unless allowDedicatedCPU (KubeVirt DedicatedCPUPlacement). Complements
# CRD OpenAPI + reconciler guards.
#
# Tenant slug uniqueness is controller-enforced (#15/#20). Admission-time slug
# checks wait on validating webhooks (#26 residual) — blocked until cert-manager
# is installed for Helm Certificate + :9443 ValidatingWebhookConfiguration.
crAdmission:
  enabled: true
  # When false (default), VAP rejects Offering/Instance dedicatedCPU=true and
  # the reconciler refuses DedicatedCPUPlacement unless
  # VIRTFOUNDRY_ALLOW_DEDICATED_CPU=true (set automatically when this is true).
  allowDedicatedCPU: false


resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Homelab sideload: set pullPolicy IfNotPresent after ctr import.

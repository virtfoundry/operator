---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachineinstances
  - virtualmachines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - virtfoundry.io
  resources:
  - instances
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - virtfoundry.io
  resources:
  - instances/finalizers
  - tenants/finalizers
  verbs:
  - update
- apiGroups:
  - virtfoundry.io
  resources:
  - instances/status
  - tenants/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - virtfoundry.io
  resources:
  - offerings
  - templates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - virtfoundry.io
  resources:
  - tenants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

name: Build and push images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/virtfoundry/operator
  ARGO_HOMELAB_REPO: Matheus-Thurler/argo-homelab
  ARGO_VALUES_PATH: platform/virtfoundry/values-operator-homelab.yaml

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Prefer semver / commit SHA tags for installs. Do not publish floating `latest`.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # Pin digest in argo-homelab so Argo CD sees a Git change and rolls pods.
      # Requires repo secret ARGO_HOMELAB_TOKEN (contents:write on Matheus-Thurler/argo-homelab).
      - name: Pin image digest in argo-homelab
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ARGO_HOMELAB_TOKEN: ${{ secrets.ARGO_HOMELAB_TOKEN }}
          OPERATOR_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${ARGO_HOMELAB_TOKEN:-}" ]; then
            echo "::error::Missing secret ARGO_HOMELAB_TOKEN (PAT with contents:write on ${ARGO_HOMELAB_REPO})."
            exit 1
          fi
          if [ -z "${OPERATOR_DIGEST:-}" ]; then
            echo "::error::Missing image digest from build-push"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          WORKDIR="${RUNNER_TEMP}/argo-homelab"
          BASIC_AUTH="$(printf 'x-access-token:%s' "${ARGO_HOMELAB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: Basic ${BASIC_AUTH}" \
            clone --depth 1 "https://github.com/${ARGO_HOMELAB_REPO}.git" "$WORKDIR" \
            || {
              echo "::error::Clone of ${ARGO_HOMELAB_REPO} failed. Rotate ARGO_HOMELAB_TOKEN."
              exit 1
            }
          cd "$WORKDIR"
          git config user.name "virtfoundry-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local http.https://github.com/.extraheader "Authorization: Basic ${BASIC_AUTH}"

          VALUES="$ARGO_VALUES_PATH"
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path(os.environ["ARGO_VALUES_PATH"])
          text = path.read_text()
          digest = os.environ["OPERATOR_DIGEST"]
          if not digest.startswith("sha256:"):
              raise SystemExit(f"unexpected digest {digest!r}")
          out = re.sub(
              r'(?m)^(\s*digest:\s*")[^"]*(")\s*$',
              rf'\1{digest}\2',
              text,
              count=1,
          )
          out = re.sub(r"(?m)^(\s*pullPolicy:\s*).+$", r"\1IfNotPresent", out, count=1)
          if out == text:
              raise SystemExit("values file unchanged — check image.digest key exists")
          path.write_text(out)
          print(f"pinned operator digest -> {digest}")
          PY

          git add "$VALUES"
          if git diff --cached --quiet; then
            echo "No digest change; skipping commit"
            exit 0
          fi
          git commit -m "chore(virtfoundry): pin operator image to ${SHORT_SHA}"
          git push origin HEAD:main
